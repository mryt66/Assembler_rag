prompt: |
  Oceń, czy poniższa odpowiedź LLMa dotyczy języka Maszyny W.

  Odpowiedź dotyczy Maszyny W, jeśli:
    Dotyczy wyłącznie programowania w Maszynie W lub działania jej instrukcji (rozkazy, pseudorozkazy, składnia linii, tworzenie programów).
    Programowanie jest w języku asemblera.
    Przykładowe rozkazy: STP, SOB, SOM, SOZ, POB, ŁAD, DOD, ODE.
    Mogą również występować inne rozkazy lub nowe własne.
    Może również stwierdzać, że pytanie nie dotyczy Maszyny W — w tym przypadku również uznajemy je za „dotyczy”.

  Odpowiedź nie dotyczy Maszyny W, jeśli odnosi się do innych języków programowania lub jakichkolwiek innych informacji niezwiązanych z Maszyną W, lub programowaniem w niej.

  Odpowiedź LLM-a (Gemini):
  {output}

  Zwróć tylko jedną cyfrę: 1 jeśli dotyczy, 0 jeśli nie dotyczy.